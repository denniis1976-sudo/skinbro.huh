<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SKINBRO DEMO — Открытие кейсов CS2</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      background-color: #111318;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }
    .hidden { display: none !important; }

    /* Лайв-лента дропов */
    .live-strip {
      background: #0b0c10;
      border-bottom: 1px solid #1f232e;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .live-pill {
      background: rgba(250, 204, 21, 0.12);
      border: 1px solid rgba(250, 204, 21, 0.4);
      color: #facc15;
      font-size: 11px;
      font-weight: 900;
      padding: 5px 10px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      text-transform: uppercase;
    }
    .live-dot {
      width: 7px; height: 7px; border-radius: 50%; background: #facc15;
      animation: blink 1.2s infinite;
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
    .live-list {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .live-list::-webkit-scrollbar { display: none; }
    .live-item {
      flex-shrink: 0;
      background: #171a23;
      border-radius: 8px;
      padding: 5px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 2px solid #3b82f6;
      font-size: 11px;
    }

    /* Шапка сайта */
    header {
      background: #161922;
      border-bottom: 1px solid #232836;
      padding: 12px 16px;
      position: sticky;
      top: 0;
      z-index: 30;
    }
    .header-wrap {
      max-width: 1140px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .brand {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 0.5px;
      color: #ffffff;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .brand span {
      background: #facc15;
      color: #111318;
      padding: 2px 7px;
      border-radius: 6px;
      font-size: 18px;
    }
    .nav-tabs {
      display: flex;
      gap: 6px;
    }
    .tab-btn {
      background: #1e222e;
      border: 1px solid #2b3040;
      color: #9ca3af;
      font-weight: 800;
      font-size: 12px;
      text-transform: uppercase;
      padding: 8px 13px;
      border-radius: 8px;
      cursor: pointer;
    }
    .tab-btn.active {
      background: #facc15;
      border-color: #facc15;
      color: #111318;
    }
    .inv-badge {
      background: rgba(0,0,0,0.25);
      padding: 1px 6px;
      border-radius: 6px;
      margin-left: 4px;
    }
    .wallet {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #1e222e;
      border: 1px solid #2e3446;
      padding: 5px 6px 5px 12px;
      border-radius: 10px;
    }
    .wallet-sum {
      font-weight: 900;
      font-size: 14px;
      color: #facc15;
    }
    .wallet-add {
      background: #22c55e;
      color: #052e16;
      border: none;
      font-weight: 900;
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 7px;
      cursor: pointer;
    }

    /* Основной контейнер */
    main {
      max-width: 1140px;
      width: 100%;
      margin: 0 auto;
      padding: 24px 16px;
      flex: 1;
    }
    .sec-title {
      font-size: 22px;
      font-weight: 900;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .sec-title::before {
      content: '';
      width: 5px;
      height: 22px;
      background: #facc15;
      border-radius: 3px;
    }
    .sec-sub {
      color: #9ca3af;
      font-size: 13px;
      margin: 6px 0 20px;
    }

    /* Сетка кейсов */
    .cases-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
    }
    .case-box {
      background: linear-gradient(180deg, #1b1f2b 0%, #141720 100%);
      border: 1px solid #272c3d;
      border-radius: 14px;
      padding: 20px 14px;
      text-align: center;
      cursor: pointer;
      position: relative;
      transition: transform 0.2s, border-color 0.2s;
    }
    .case-box:hover {
      transform: translateY(-4px);
      border-color: #facc15;
    }
    .case-label {
      position: absolute;
      top: 10px;
      left: 10px;
      background: #facc15;
      color: #111318;
      font-size: 10px;
      font-weight: 900;
      padding: 3px 8px;
      border-radius: 5px;
    }
    .case-emoji {
      font-size: 62px;
      margin: 14px 0;
      filter: drop-shadow(0 8px 16px rgba(0,0,0,0.5));
    }
    .case-name {
      font-size: 16px;
      font-weight: 900;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    .case-btn {
      display: inline-block;
      background: #252a3a;
      color: #facc15;
      border: 1px solid #363d54;
      font-weight: 900;
      font-size: 14px;
      padding: 8px 20px;
      border-radius: 8px;
    }
    .case-box:hover .case-btn {
      background: #facc15;
      color: #111318;
      border-color: #facc15;
    }

    /* Цвета редкости CS2 */
    .rar-blue   { border-bottom: 3px solid #3b82f6 !important; background: linear-gradient(180deg, rgba(59,130,246,0.2), #161922) !important; }
    .rar-purple { border-bottom: 3px solid #a855f7 !important; background: linear-gradient(180deg, rgba(168,85,247,0.2), #161922) !important; }
    .rar-pink   { border-bottom: 3px solid #ec4899 !important; background: linear-gradient(180deg, rgba(236,72,153,0.22), #161922) !important; }
    .rar-red    { border-bottom: 3px solid #ef4444 !important; background: linear-gradient(180deg, rgba(239,68,68,0.25), #161922) !important; }
    .rar-gold   { border-bottom: 3px solid #facc15 !important; background: linear-gradient(180deg, rgba(250,204,21,0.28), #161922) !important; }

    /* Модалка рулетки */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(8, 9, 13, 0.9);
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }
    .modal-card {
      background: #161922;
      border: 1px solid #2c3244;
      border-radius: 16px;
      max-width: 740px;
      width: 100%;
      padding: 20px;
      position: relative;
      max-height: 92vh;
      overflow-y: auto;
    }
    .modal-close {
      position: absolute;
      top: 12px;
      right: 14px;
      background: #232836;
      border: none;
      color: #fff;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }
    .roulette-box {
      position: relative;
      background: #0d0f14;
      border: 2px solid #262b3b;
      border-radius: 12px;
      height: 144px;
      overflow: hidden;
      margin: 16px 0;
    }
    .roulette-pointer {
      position: absolute;
      top: 0; bottom: 0; left: 50%;
      width: 3px;
      background: #facc15;
      transform: translateX(-50%);
      z-index: 10;
      box-shadow: 0 0 12px #facc15;
    }
    .roulette-line {
      display: flex;
      align-items: center;
      height: 100%;
      gap: 8px;
      padding: 0 8px;
      will-change: transform;
    }
    .skin-tile {
      flex-shrink: 0;
      width: 120px;
      height: 124px;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px;
      text-align: center;
    }
    .btn-yellow {
      background: #facc15;
      color: #111318;
      border: none;
      font-weight: 900;
      font-size: 14px;
      text-transform: uppercase;
      padding: 13px 28px;
      border-radius: 10px;
      cursor: pointer;
    }
    .btn-yellow:disabled {
      background: #262b3b;
      color: #6b7280;
      cursor: not-allowed;
    }
    .btn-sell {
      background: #22c55e;
      color: #052e16;
      border: none;
      font-weight: 900;
      font-size: 13px;
      padding: 12px 20px;
      border-radius: 10px;
      cursor: pointer;
    }
    .drop-banner {
      background: #101219;
      border: 1px solid #2e3446;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      margin-bottom: 16px;
    }
    .loot-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(105px, 1fr));
      gap: 8px;
      margin-top: 10px;
    }
    .loot-item {
      border-radius: 8px;
      padding: 8px;
      text-align: center;
      font-size: 11px;
    }

    /* Инвентарь и Апгрейд */
    .inv-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
      gap: 12px;
    }
    .upg-panel {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 16px;
      background: #161922;
      border: 1px solid #262b3b;
      border-radius: 14px;
      padding: 16px;
    }
    .upg-box {
      background: #0f1117;
      border: 1px solid #232836;
      border-radius: 10px;
      padding: 12px;
      max-height: 280px;
      overflow-y: auto;
    }
    .upg-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 10px;
    }
    .upg-card {
      background: #171b26;
      border: 1px solid #282e3f;
      border-radius: 8px;
      padding: 8px;
      text-align: center;
      cursor: pointer;
      font-size: 11px;
    }
    .upg-card.active {
      border-color: #facc15;
      background: rgba(250, 204, 21, 0.14);
    }
    .wheel {
      width: 150px;
      height: 150px;
